<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoMX - Noticias Generales</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Configuración de colores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Estilos para el iframe a pantalla completa */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-red-600 selection:text-white">

    <!-- ENCABEZADO (Estilo Noticias General) -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 h-16 shrink-0">
        <div class="w-full h-full px-4 md:px-6">
            <div class="flex justify-between items-center h-full">
                <!-- Logo y Mensaje -->
                <div class="flex items-center space-x-3">
                    <!-- Color Rojo para Noticias Generales -->
                    <div class="bg-red-600 p-1.5 rounded-lg shadow-lg shadow-red-600/20">
                        <i data-lucide="globe-2" class="h-5 w-5 text-white"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold text-white tracking-tight leading-tight">
                            Info<span class="text-red-600">MX</span>
                        </span>
                        <span class="text-[10px] uppercase tracking-wider text-slate-400 font-medium">
                            México y el Mundo
                        </span>
                    </div>
                </div>

                <!-- Botón de Regresar -->
                <!-- CAMBIA EL HREF POR TU INDEX.HTML O URL PRINCIPAL -->
                <a href="/seccion/" 
                   class="flex items-center group space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg transition-all border border-slate-700 hover:border-slate-500">
                    <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i>
                    <span class="text-sm font-medium">Volver al Home</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="w-full max-w-7xl mx-auto px-4 py-4 md:py-6">
        
        <!-- Barra de Fuente -->
        <div class="flex justify-between items-center px-2 mb-2 shrink-0">
            <div class="flex items-center text-xs text-slate-500">
                <i data-lucide="rss" class="w-3 h-3 mr-1"></i> Fuente: Milenio Diario
            </div>
            <a href="https://www.milenio.com/" 
               target="_blank" 
               rel="noreferrer"
               class="flex items-center text-xs text-red-500 hover:text-red-400 font-medium">
                <i data-lucide="external-link" class="w-3 h-3 mr-1"></i> Leer en sitio original
            </a>
        </div>

        <!-- Contenedor del Iframe -->
        <div class="iframe-container bg-white rounded-xl overflow-hidden border border-slate-700 shadow-2xl relative">
            
            <!-- 
               NOTA DE COMPATIBILIDAD:
               Muchos periódicos grandes (El Universal, Reforma) bloquean iframes.
               Milenio suele ser más permisivo, pero si falla, prueba con portales regionales
               o agencias como 'https://www.infobae.com/america/mexico/'
            -->
            <iframe 
                src="https://www.milenio.com/" 
                allow="autoplay; fullscreen"
                title="Noticias México General">
            </iframe>
            
            <!-- Mensaje de carga / fondo -->
            <div class="absolute inset-0 flex flex-col items-center justify-center -z-10 bg-slate-100 text-slate-500">
                <p class="animate-pulse font-medium">Cargando las noticias más importantes...</p>
            </div>
        </div>

    </main>

    <!-- Script para inicializar los iconos -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
