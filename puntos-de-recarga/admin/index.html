<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cool Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #000707;
            color: #BCEAD5;
        }
        .cool-card {
            background-color: rgba(44, 51, 51, 0.4);
            border: 1px solid #0E8388;
            border-radius: 1.25rem;
        }
        .cool-input {
            background-color: #2C3333;
            border: 1px solid #4B5563;
            color: white;
            border-radius: 0.75rem;
        }
        .progress-bar {
            transition: width 0.1s linear;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000707; }
        ::-webkit-scrollbar-thumb { background: #0E8388; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <h1 class="text-3xl font-black text-[#57C5B6]">Panel Interno</h1>
        <div class="flex gap-2 md:gap-4">
            <button onclick="deleteAllStores()" id="delete-all-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 md:px-6 py-2 rounded-full font-bold transition flex items-center gap-2 text-sm shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                Borrar DB
            </button>
            <a href="index.html" class="border border-[#0E8388] text-[#BCEAD5] px-4 md:px-6 py-2 rounded-full hover:bg-[#0E8388] transition text-sm">Ver Sitio</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">
        <div class="space-y-8">
            <!-- Sección de Carga Masiva Mejorada -->
            <section class="cool-card p-8 shadow-2xl border-2 border-[#57C5B6]">
                <h2 class="text-xl font-bold mb-2 text-[#CBE4DE]">Carga Masiva (Fix Acentos)</h2>
                <p class="text-xs text-slate-400 mb-6 italic">Si los acentos salen mal (""), cambia la codificación antes de subir.</p>
                
                <div class="space-y-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase font-bold text-slate-500">1. Codificación del Archivo:</label>
                        <select id="csv-encoding" class="p-2 cool-input text-xs">
                            <option value="UTF-8">UTF-8 (Estándar Web)</option>
                            <option value="ISO-8859-1">Legado (Excel / Windows-1252)</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-[10px] uppercase font-bold text-slate-500">2. Seleccionar CSV:</label>
                        <input type="file" id="csv-file" accept=".csv" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-[#0E8388] file:text-white hover:file:bg-[#57C5B6]">
                    </div>
                    
                    <button id="import-btn" class="w-full bg-[#57C5B6] text-black hover:bg-[#BCEAD5] py-4 rounded-xl font-black transition flex items-center justify-center gap-2 text-lg shadow-xl uppercase">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        Procesar y Sincronizar
                    </button>

                    <div id="progress-container" class="hidden space-y-3 bg-black bg-opacity-60 p-5 rounded-2xl border border-gray-800">
                        <div class="flex justify-between text-xs font-bold uppercase">
                            <span id="progress-text" class="text-[#57C5B6]">Cargando...</span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden border border-gray-700">
                            <div id="progress-bar" class="bg-[#57C5B6] h-full progress-bar shadow-[0_0_10px_#57C5B6]" style="width: 0%"></div>
                        </div>
                        <p id="quota-warning" class="hidden text-[10px] text-center text-red-400 font-bold uppercase">⚠️ Cuota de Firebase agotada. Continúa mañana.</p>
                    </div>
                </div>
            </section>

            <!-- Registro Individual -->
            <section class="cool-card p-8 shadow-2xl opacity-90">
                <h2 class="text-xl font-bold mb-6 text-[#CBE4DE]">Registro Individual</h2>
                <form id="store-form" class="space-y-4">
                    <input type="text" id="store-name" placeholder="Nombre" required class="w-full p-3 cool-input">
                    <select id="store-state" required class="w-full p-3 cool-input text-sm">
                        <option value="" disabled selected>Estado</option>
                        <option value="Aguascalientes">Aguascalientes</option><option value="Baja California">Baja California</option><option value="Baja California Sur">Baja California Sur</option><option value="Campeche">Campeche</option><option value="Chiapas">Chiapas</option><option value="Chihuahua">Chihuahua</option><option value="Ciudad de México">Ciudad de México</option><option value="Coahuila">Coahuila</option><option value="Colima">Colima</option><option value="Durango">Durango</option><option value="Estado de México">Estado de México</option><option value="Guanajuato">Guanajuato</option><option value="Guerrero">Guerrero</option><option value="Hidalgo">Hidalgo</option><option value="Jalisco">Jalisco</option><option value="Michoacán">Michoacán</option><option value="Morelos">Morelos</option><option value="Nayarit">Nayarit</option><option value="Nuevo León">Nuevo León</option><option value="Oaxaca">Oaxaca</option><option value="Puebla">Puebla</option><option value="Querétaro">Querétaro</option><option value="Quintana Roo">Quintana Roo</option><option value="San Luis Potosí">San Luis Potosí</option><option value="Sinaloa">Sinaloa</option><option value="Sonora">Sonora</option><option value="Tabasco">Tabasco</option><option value="Tamaulipas">Tamaulipas</option><option value="Tlaxcala">Tlaxcala</option><option value="Veracruz">Veracruz</option><option value="Yucatán">Yucatán</option><option value="Zacatecas">Zacatecas</option>
                    </select>
                    <input type="text" id="store-address" placeholder="Dirección" required class="w-full p-3 cool-input">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" step="any" id="store-lat" placeholder="Latitud" required class="p-3 cool-input">
                        <input type="number" step="any" id="store-lng" placeholder="Longitud" required class="p-3 cool-input">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-[#0E8388] hover:bg-[#57C5B6] text-white py-3 rounded-xl font-bold transition uppercase">Guardar</button>
                </form>
            </section>
        </div>

        <!-- Lista -->
        <section class="space-y-6">
            <div class="flex justify-between items-end">
                <h2 class="text-xl font-bold text-[#CBE4DE]">Registros en Nube</h2>
                <div class="text-right">
                    <span id="store-count-admin" class="text-3xl font-black text-[#57C5B6]">0</span>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-tighter">Tiendas Totales</p>
                </div>
            </div>
            <div class="cool-card overflow-hidden shadow-2xl h-[750px] flex flex-col border border-gray-800">
                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-left">
                        <thead class="bg-[#2C3333] sticky top-0 z-10 text-[10px] uppercase font-bold text-[#57C5B6]">
                            <tr>
                                <th class="p-4 border-b border-gray-700">Tienda</th>
                                <th class="p-4 border-b border-gray-700">Estado</th>
                                <th class="p-4 border-b border-gray-700 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-gray-800"></tbody>
                    </table>
                </div>
                <div id="loading-indicator" class="p-8 text-center text-slate-500 italic text-sm">Conectando...</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs, writeBatch, limit, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4ZiFpsPw8fZoChlbFg2f-Ox3rlnbFFDw",
            authDomain: "puntos-recarga.firebaseapp.com",
            projectId: "puntos-recarga",
            storageBucket: "puntos-recarga.firebasestorage.app",
            messagingSenderId: "280928383235",
            appId: "1:280928383235:web:76e88f18f0c905a79fb936"
        };

        const appId = "puntos-recarga";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storesCol = collection(db, 'artifacts', appId, 'public', 'data', 'stores');

        let isImporting = false;

        onAuthStateChanged(auth, (user) => {
            if (user) listenToStores();
            else signInAnonymously(auth);
        });

        function listenToStores() {
            const q = query(storesCol, orderBy('timestamp', 'desc'), limit(50));
            onSnapshot(storesCol, (snap) => {
                document.getElementById('store-count-admin').innerText = snap.size.toLocaleString();
            });
            onSnapshot(q, (snapshot) => {
                const stores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const body = document.getElementById('admin-table-body');
                document.getElementById('loading-indicator').classList.add('hidden');
                body.innerHTML = stores.map(s => `
                    <tr class="hover:bg-gray-800/50 transition">
                        <td class="p-4 text-xs">
                            <div class="font-bold text-[#BCEAD5]">${s.name || 'S/N'}</div>
                            <div class="text-[9px] text-gray-500 truncate w-40">${s.address || ''}</div>
                        </td>
                        <td class="p-4 text-[10px] opacity-70 font-bold">${s.state || s.city || 'S/E'}</td>
                        <td class="p-4 text-right">
                            <button onclick="window.deleteStore('${s.id}')" class="text-red-500 text-[9px] font-black uppercase">Borrar</button>
                        </td>
                    </tr>
                `).join('');
                if(snapshot.size === 0) body.innerHTML = '<tr><td colspan="3" class="p-10 text-center opacity-30 italic">Vacío</td></tr>';
            });
        }

        window.deleteAllStores = async () => {
            if (!confirm("⚠️ Se borrará toda la base de datos. ¿Continuar?")) return;
            const btn = document.getElementById('delete-all-btn');
            btn.disabled = true; btn.innerText = "Borrando...";
            try {
                const snapshot = await getDocs(storesCol);
                const docs = snapshot.docs;
                for (let i = 0; i < docs.length; i += 500) {
                    const batch = writeBatch(db);
                    docs.slice(i, i + 500).forEach(d => batch.delete(d.ref));
                    await batch.commit();
                }
                alert("Base de datos limpia.");
            } catch (e) { alert("Error al borrar."); }
            finally { btn.disabled = false; btn.innerHTML = "Borrar DB"; }
        };

        document.getElementById('import-btn').addEventListener('click', async () => {
            if (isImporting) return;
            const fileInput = document.getElementById('csv-file');
            const encoding = document.getElementById('csv-encoding').value;
            if (!fileInput.files.length) return alert("Selecciona un archivo CSV.");

            const file = fileInput.files[0];
            const reader = new FileReader();
            const container = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const percentText = document.getElementById('progress-percent');
            const warning = document.getElementById('quota-warning');

            reader.onload = async (e) => {
                isImporting = true;
                warning.classList.add('hidden');
                const text = e.target.result;
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
                const delimiter = lines[0].includes(';') ? ';' : ',';
                const dataLines = lines.slice(1);
                const total = dataLines.length;
                
                container.classList.remove('hidden');
                let batch = writeBatch(db);
                let batchCount = 0;
                let globalCount = 0;

                for (let i = 0; i < total; i++) {
                    const row = parseCSVLine(dataLines[i], delimiter);
                    if (row.length >= 5) {
                        const lat = parseFloat(row[3]);
                        const lng = parseFloat(row[4]);
                        if (!isNaN(lat) && !isNaN(lng)) {
                            batch.set(doc(storesCol), {
                                name: row[0], state: row[1], city: row[1], address: row[2],
                                lat, lng, timestamp: Date.now() + i
                            });
                            batchCount++; globalCount++;
                        }
                    }

                    if (batchCount === 500 || i === total - 1) {
                        try {
                            await batch.commit();
                            batch = writeBatch(db);
                            batchCount = 0;
                            const percent = Math.round(((i + 1) / total) * 100);
                            progressBar.style.width = percent + "%";
                            percentText.innerText = percent + "%";
                        } catch (err) {
                            if(err.code === 'resource-exhausted') {
                                warning.classList.remove('hidden');
                                alert("Cuota agotada. Proceso detenido en " + globalCount);
                                break;
                            }
                        }
                    }
                }
                alert("¡Finalizado! Registros procesados: " + globalCount);
                isImporting = false;
                container.classList.add('hidden');
            };
            // Usar la codificación seleccionada para leer los acentos
            reader.readAsText(file, encoding);
        });

        function parseCSVLine(text, delimiter) {
            const result = []; let current = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === delimiter && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result.map(v => v.replace(/^"|"$/g, ''));
        }

        document.getElementById('store-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            try {
                const state = document.getElementById('store-state').value;
                await addDoc(storesCol, {
                    name: document.getElementById('store-name').value,
                    state, city: state,
                    address: document.getElementById('store-address').value,
                    lat: parseFloat(document.getElementById('store-lat').value),
                    lng: parseFloat(document.getElementById('store-lng').value),
                    timestamp: Date.now()
                });
                e.target.reset();
            } finally { btn.disabled = false; }
        });

        window.deleteStore = async (id) => {
            if (confirm("¿Eliminar?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stores', id));
        };
    </script>
</body>
</html>
